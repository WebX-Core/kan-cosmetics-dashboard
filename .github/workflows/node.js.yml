name: KAN Cosmetics Dashboard CI/CD (VPS)

on:
  push:
    branches: ["master", "main"]

concurrency:
  group: kan-cosmetics-dashboard-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }} # aditya
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            echo "✅ SSH connection successful!"
            echo "👤 User: $(whoami)"
            echo "📁 Home: $HOME"

            APP_DIR="/var/www/kan-cosmetics-dashboard"
            BRANCH="${{ github.ref_name }}"

            echo "📦 Deploying branch: $BRANCH"
            cd "$APP_DIR"

            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # ---- Ensure pnpm exists (user-space, no sudo) ----
            export NPM_CONFIG_PREFIX="$HOME/.npm-global"
            export PATH="$HOME/.npm-global/bin:$PATH"

            if ! command -v pnpm >/dev/null 2>&1; then
              echo "📦 pnpm not found, installing pnpm@10.15.0 in user space..."
              npm i -g pnpm@10.15.0
            fi

            echo "🧰 Node: $(node -v)"
            echo "🧰 npm: $(npm -v)"
            echo "🧰 pnpm: $(pnpm -v)"

            echo "📥 Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "🛠 Building the project..."
            pnpm build

            echo "🔎 Checking build output..."
            test -f "$APP_DIR/dist/index.html"

            echo "🔄 Reloading Nginx..."
            sudo nginx -t
            sudo systemctl reload nginx

            echo "✅ Deploy complete!"
